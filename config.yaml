# Project configuration — single source of truth for configurable values.
#
# Sections: paths, data, model, training, evaluation, random_forest, optuna, federated.
# Every section is validated strictly by core/config.py: unknown keys and
# out-of-range values are rejected. Relative paths are relative to this file.
#
# model.ann and training hold UNTUNED defaults used by a plain
# `python -m core.train` run. The tuned centralized ANN configuration found by
# Optuna is stored in results/best_hyperparameters.json (and is what the
# federated ANN uses) — this file is not overwritten by the search.

seed: 42          # global seed (data splits, DataLoader shuffling, weight init, RF random_state)
device: auto      # auto (cuda > mps > cpu) | cuda | mps | cpu

paths:
  results_dir: results     # metrics JSON, comparison tables, Optuna study
  graphs_dir: graphs       # generated plots

data:
  dataset_dir: dataset     # cleaned_data / train / test / client_{A,B,C} parquet files
  test_size: 0.2           # train/test split fraction — used ONLY if train/test.parquet are missing;
                           # an existing held-out test set is never re-split
  val_fraction: 0.1        # stratified validation slice taken from each client file
  eval_batch_size: 4096    # batch size for validation/test loaders (no gradients)
  num_workers: 0           # DataLoader worker processes (0 = load in main process)
  pin_memory: false        # only takes effect on CUDA

model:
  # input_dim is not set here: it is inferred from the data (number of feature columns).
  ann:
    hidden_sizes: [128, 64]   # one entry per hidden layer
    batch_norm: false         # BatchNorm1d after each hidden Linear layer
    dropout: 0.2              # dropout after each hidden activation; 0 disables

training:
  optimizer: adam          # sgd | adam | adamw
  learning_rate: 0.001
  weight_decay: 0.0        # L2 penalty (Adam/SGD) or decoupled decay (AdamW)
  momentum: 0.9            # used only when optimizer is sgd
  batch_size: 512          # training batch size (val/test use data.eval_batch_size)
  epochs: 20               # maximum epochs; early stopping may end training sooner
  grad_clip_norm: null     # max total gradient L2 norm; null disables clipping
  class_weighting: none    # none (pos_weight = 1) | balanced (n_benign / n_attack of the training split)
                           # | balanced_scaled (balanced x pos_weight_scale)
  pos_weight_scale: 1.0    # used only by balanced_scaled
  early_stopping:
    metric: val_loss       # any per-epoch history key: val_loss, or val_pr_auc / val_f1 when those are computed
    mode: min              # min = lower is better (losses); max = higher is better (PR-AUC, F1)
    patience: 3            # epochs without improvement before stopping
    min_delta: 0.0         # minimum change that counts as an improvement
  checkpoint_dir: models/ann_centralized   # best.pt + latest.pt

evaluation:
  default_threshold: 0.5        # decision threshold on P(attack) when none has been selected
  threshold_strategy: max_f1    # max_f1 | max_macro_f1 | target_recall | fixed (= default_threshold)
  target_recall: 0.99           # used only by target_recall: minimum attack recall to reach on validation

random_forest:
  # Centralized RF baseline (centralized/train_rf.py). random_state = seed.
  model_path: models/rf_baseline.joblib
  hyperparameters:
    n_estimators: 200
    max_depth: null              # null = grow trees fully
    class_weight: balanced       # balanced | balanced_subsample | null
    n_jobs: -1                   # -1 = all cores

optuna:
  # Hyperparameter search for the CENTRALIZED ANN (core/optuna_search.py).
  # Objective: validation PR-AUC (attack class), maximized. Each trial samples
  # values for the model.ann and training sections above; anything not sampled
  # keeps its value from those sections.
  study_name: ann_centralized
  storage: results/optuna/ann_centralized.db   # SQLite file
  n_trials: 40                 # total finished trials (complete + pruned + failed); a resumed study continues up to this
  timeout_seconds: null        # optional wall-clock limit for one invocation
  sampler_seed: 42             # TPE sampler seed
  pruner:                      # MedianPruner on per-epoch val_pr_auc
    n_startup_trials: 5        # trials that are never pruned (build up the median first)
    n_warmup_epochs: 2         # epochs before a trial can be pruned
  early_stopping:              # per-trial early stopping on val_pr_auc (mode max)
    patience: 3
    min_delta: 0.0001
  final_checkpoint_dir: models/ann_centralized_tuned   # retrained best config
  search_space:                # [low, high] ranges or lists of choices
    n_layers: [1, 4]                       # number of hidden layers
    layer_size: [32, 512]                  # units per hidden layer (log scale, sampled per layer)
    optimizer: [sgd, adam, adamw]
    epochs: [5, 30]                        # max epochs; early stopping usually ends sooner
    learning_rate: [0.0001, 0.01]          # log scale
    batch_size: [256, 512, 1024, 2048]
    dropout: [0.0, 0.5]
    weight_decay: [0.000001, 0.01]         # lambda, log scale
    batch_norm: [false, true]
    momentum: [0.8, 0.99]                  # sampled only when optimizer is sgd
    grad_clip: [false, true]               # whether clipping is enabled
    grad_clip_norm: [0.5, 10.0]            # sampled only when clipping is enabled (log scale)
    class_weighting: [none, balanced, balanced_scaled]
    pos_weight_scale: [0.25, 4.0]          # sampled only for balanced_scaled (log scale)
    # Not searched: activation function (ann.py implements ReLU only) and LR
    # scheduler (none implemented). Add them here once they exist.

federated:
  # Federated simulation (Flower, FedAvg) across clients A, B, C — federated/server.py.
  model: ann                   # ann | logistic_regression (overridable with --model)
  # For model: ann, the architecture AND local-training settings (optimizer, lr,
  # weight decay, batch size, clipping, class weighting) come from this Optuna
  # result for the CENTRALIZED ANN — not from model.ann / training above.
  # For model: logistic_regression, local training uses the training section above.
  ann_hyperparameters: results/best_hyperparameters.json
  rounds: 15                   # communication rounds
  local_epochs: 3              # epochs each client trains per round (1 was tried: smoother but lower val PR-AUC after 15 rounds)
  client_device: cpu           # device inside each simulated client process (cpu | mps | cuda | auto)
  client_num_cpus: 2           # CPU cores reserved per simulated client (also torch threads)
  checkpoint_dir: models/federated   # <dir>/<model>/best.pt (best round by val PR-AUC) and latest.pt
  # Per-round validation results go to <paths.results_dir>/federated_<model>_validation_rounds.json
